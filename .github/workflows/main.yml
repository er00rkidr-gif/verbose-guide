
name: Build PipModBetaEarly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Extract mod ZIP if needed
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Extracting $zipfile"
              unzip -oq "$zipfile" -d extracted
            fi
          done

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find . \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -name build.gradle \
            -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Minecraft Mod
        run: |
          gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PipModBetaEarly-JAR
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
          if-no-files-found: error
